name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check mixtriad tests examples

  manifest:
    name: Integrity manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify MANIFEST.sha256
        run: sha256sum -c MANIFEST.sha256
      - name: Hint on failure
        if: failure()
        run: |
          echo "::error::MANIFEST.sha256 is out of date. After editing tracked files, regenerate it:"
          echo '  find . -type f ! -path "./.git/*" ! -name MANIFEST.sha256 | sed "s|^\./||" | LC_ALL=C sort | while read -r f; do sha256sum "$f"; done > MANIFEST.sha256'

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.extras }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        extras: ["core"]
        include:
          # one job with the full optional stack (xgboost + optuna + shap)
          - python-version: "3.12"
            extras: "all"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.extras }}" = "all" ]; then
            python -m pip install -e ".[all]"
          else
            python -m pip install -e .
          fi
          python -m pip install pytest hypothesis
      - name: Built-in self-check
        run: mixtriad selfcheck
      - name: Test suite
        run: python -m pytest tests -q

  demo:
    name: End-to-end demo pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (core only - exercises the HistGB fallback path)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run the full three-stage pipeline on the shipped corpus
        run: mixtriad run examples/misinfo_config.yaml --outdir demo_out
      - name: Check key artefacts exist and are non-empty
        run: |
          for f in report.md \
                   stage1_ols.csv \
                   stage2_model_comparison.csv \
                   stage3_truthtable_outcome.csv \
                   stage3_solution_intermediate_outcome.csv \
                   fig_importance.png \
                   fig_configurations_outcome.png; do
            test -s "demo_out/$f" || { echo "::error::missing or empty artefact: $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: demo-artefacts
          path: demo_out/
          retention-days: 14

  studio:
    name: Browser tool smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install jsdom
        run: npm install jsdom --no-save
      - name: Headless walk-through of mixtriad_studio.html on the demo corpus
        run: node tests/studio_smoke.js
